name: FTP Debug

on:
  workflow_dispatch:

jobs:
  ftp-debug:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP Root
        run: |
          echo "=== FTP ROOT ==="
          curl --list-only --user "${{ secrets.HOSTINGER_FTP_USERNAME }}:${{ secrets.HOSTINGER_FTP_PASSWORD }}" "ftp://${{ secrets.HOSTINGER_FTP_HOST }}:${{ secrets.HOSTINGER_FTP_PORT }}/"

      - name: List /public_html/
        run: |
          echo "=== /public_html/ ==="
          curl --list-only --user "${{ secrets.HOSTINGER_FTP_USERNAME }}:${{ secrets.HOSTINGER_FTP_PASSWORD }}" "ftp://${{ secrets.HOSTINGER_FTP_HOST }}:${{ secrets.HOSTINGER_FTP_PORT }}/public_html/"
