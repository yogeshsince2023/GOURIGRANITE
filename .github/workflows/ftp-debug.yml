name: FTP Debug
on: workflow_dispatch
jobs:
  ftp-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verify gourideploy and Hostinger structure
        env:
          H: ${{ secrets.HOSTINGER_FTP_HOST }}
          P: ${{ secrets.HOSTINGER_FTP_PORT }}
          U: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          W: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          python3 -c "
          from ftplib import FTP
          import os

          server = os.environ.get('H', '').strip().replace('ftp://', '').split('/')[0]
          port = int(os.environ.get('P', '21').strip() or '21')
          password = os.environ.get('W', '')

          print('=== 1. TESTING GOURIDEPLOY ACCOUNT ===')
          usernames_to_try = [
              'gourideploy',
              'u450659410@gourideploy',
              'u450659410.gourideploy',
              'gourideploy@gourigroupindia.com'
          ]
          connected_user = None
          gouri_ftp = None

          for u in usernames_to_try:
              try:
                  print(f'Attempting login as: {u}')
                  f = FTP()
                  f.connect(server, port, timeout=15)
                  f.login(u, password)
                  print(f'SUCCESS! Logged in as: {u}')
                  connected_user = u
                  gouri_ftp = f
                  break
              except Exception as e:
                  print(f'Failed for {u}: {e}')

          if gouri_ftp:
              pwd = gouri_ftp.pwd()
              print(f'\n[gourideploy] Initial PWD: {pwd}')
              listing = []
              gouri_ftp.retrlines('LIST', listing.append)
              print(f'[gourideploy] Listing of PWD ({pwd}):')
              for item in listing:
                  print(f'  {item}')
              gouri_ftp.quit()
          else:
              print('\nCould not log in as gourideploy with current HOSTINGER_FTP_PASSWORD.')

          print('\n=== 2. INSPECTING HOSTINGER DIRECTORY STRUCTURE VIA U450659410 ===')
          try:
              f_main = FTP()
              f_main.connect(server, port, timeout=15)
              f_main.login('u450659410', password)
              f_main.cwd('/')
              print('Main account PWD: /')
              root_items = []
              f_main.retrlines('LIST', root_items.append)
              print('Root items:')
              for r in root_items:
                  if any(k in r for k in ['domains', 'public_html']):
                      print(f'  {r}')

              try:
                  f_main.cwd('/domains')
                  print('\nSuccessfully entered /domains. PWD: /domains')
                  d_items = []
                  f_main.retrlines('LIST', d_items.append)
                  print('Entries in /domains:')
                  for d in d_items:
                      print(f'  {d}')

                  for line in d_items:
                      parts = line.split()
                      if len(parts) >= 9:
                          dname = parts[-1]
                          try:
                              f_main.cwd(f'/domains/{dname}/public_html')
                              print(f'\nListing of /domains/{dname}/public_html:')
                              site_items = []
                              f_main.retrlines('LIST', site_items.append)
                              for s in site_items[:20]:
                                  print(f'  {s}')
                              if len(site_items) > 20:
                                  print(f'  ... and {len(site_items) - 20} more items')
                          except Exception as e:
                              print(f'Could not enter /domains/{dname}/public_html: {e}')
              except Exception as e:
                  print(f'Could not enter /domains: {e}')

              f_main.quit()
          except Exception as e:
              print(f'Failed main account inspection: {e}')
          " | tee -a "$GITHUB_STEP_SUMMARY"
