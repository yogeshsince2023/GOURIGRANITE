name: FTP Debug
on: workflow_dispatch
jobs:
  ftp-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show FTP root and public_html
        env:
          H: ${{ secrets.HOSTINGER_FTP_HOST }}
          P: ${{ secrets.HOSTINGER_FTP_PORT }}
          U: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          W: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          H=$(echo "$H" | tr -d '[:space:]'); H=${H#ftp://}; H=${H%%/*}
          P=$(echo "$P" | tr -d '[:space:]'); P=${P:-21}
          U=$(echo "$U" | tr -d '[:space:]')
          echo "host length: ${#H}  user length: ${#U}  password length: ${#W}"
          echo "=== FTP ROOT ==="
          curl -sS --list-only --user "$U:$W" "ftp://$H:$P/" || true
          echo "=== /public_html/ ==="
          curl -sS --list-only --user "$U:$W" "ftp://$H:$P/public_html/" || true
