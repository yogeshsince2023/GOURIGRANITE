name: FTP Directory Inspection

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  inspect-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Run Read-Only FTP Inspection
        env:
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          python3 -c "
          from ftplib import FTP
          import os, sys

          print('=== CONNECTING TO FTP ===')
          server = '82.25.107.85'
          port = 21
          username = 'u450659410'
          password = os.environ.get('HOSTINGER_FTP_PASSWORD')

          if not password:
              print('ERROR: HOSTINGER_FTP_PASSWORD not available')
              sys.exit(1)

          ftp = FTP()
          ftp.connect(server, port, timeout=30)
          ftp.login(username, password)

          print('=== INITIAL PWD ===')
          initial_pwd = ftp.pwd()
          print(f'PWD: {initial_pwd}')

          print(f'=== DIRECTORY LISTING OF INITIAL PWD ({initial_pwd}) ===')
          initial_listing = []
          ftp.retrlines('LIST', initial_listing.append)
          for item in initial_listing:
              print(f'  {item}')

          for path in ['/', 'public_html', '/public_html', 'domains']:
              try:
                  print(f'\n=== TESTING PATH: {path} ===')
                  ftp.cwd(path)
                  cur = ftp.pwd()
                  print(f'Successfully changed directory to {path}. Current PWD: {cur}')
                  listing = []
                  ftp.retrlines('LIST', listing.append)
                  print(f'Found {len(listing)} entries in {path}:')
                  for item in listing[:25]:
                      print(f'  {item}')
                  if len(listing) > 25:
                      print(f'  ... and {len(listing) - 25} more items')
              except Exception as e:
                  print(f'Path \"{path}\" could not be accessed: {e}')

          ftp.quit()
          print('\n=== FTP INSPECTION FINISHED SUCCESSFULLY ===')
          "
